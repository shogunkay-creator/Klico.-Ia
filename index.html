<!-- Módulo Automação Por Link no Klico IA -->
<div class="w-full max-w-lg card rounded-2xl p-6 shadow-lg bg-[#161b22] border border-gray-700 mt-6">
  <div class="flex items-center gap-2 mb-2">
    <span class="text-2xl">🔗</span>
    <h2 class="text-xl font-bold text-white">Gerar Propaganda por Link da Shopee</h2>
  </div>
  <p class="text-gray-400 text-sm mb-4">Cole o seu link de afiliado e a IA criará o roteiro e o vídeo de divulgação.</p>

  <label class="block text-sm text-gray-300 mb-1">Link da Shopee (Ex: https://s.shopee.com.br/...)</label>
  <input id="shopeeLinkInput" type="url" placeholder="https://s.shopee.com.br/8V9gp9n8Gy" 
         class="w-full p-3 rounded-lg bg-[#0d1117] border border-gray-700 text-white mb-4 focus:outline-none focus:border-orange-500">

  <button onclick="processarLinkShopee()" 
          class="w-full py-3 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-lg transition-all flex justify-center items-center gap-2">
    🚀 Processar Link & Criar Divulgação
  </button>

  <div id="statusProcessando" class="mt-4 hidden text-orange-400 text-sm animate-pulse">
    ⏳ Extraindo dados do produto e gerando roteiro via Gemini IA...
  </div>

  <div id="resultadoDivulgação" class="mt-6 hidden">
    <!-- Resultado do Roteiro e Mídia -->
    <h3 class="text-md font-bold text-orange-400 mb-2">🎬 Roteiro de Vídeo (TikTok/Reels)</h3>
    <div id="roteiroOutput" class="p-3 bg-[#0d1117] text-gray-200 text-sm rounded-lg mb-4 whitespace-pre-line border border-gray-800"></div>

    <h3 class="text-md font-bold text-orange-400 mb-2">📲 Legenda Pronta</h3>
    <div id="legendaOutput" class="p-3 bg-[#0d1117] text-gray-200 text-sm rounded-lg border border-gray-800"></div>
  </div>
</div>
