<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta Especial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .badge {
      background-color: #e53e3e;
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }
    p.desc {
      color: #8b949e;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .product-img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 20px;
      background-color: #21262d;
    }
    .price-box {
      background: #0d1117;
      border: 1px dashed #388bfd;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }
    .old-price {
      text-decoration: line-through;
      color: #8b949e;
      font-size: 14px;
    }
    .current-price {
      font-size: 28px;
      font-weight: bold;
      color: #2ea043;
      margin-top: 4px;
    }
    .btn-buy {
      display: block;
      width: 100%;
      background-color: #238636;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      padding: 16px;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .btn-buy:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="badge">PROMOÇÃO</span>
    <h1>Nome do Seu Produto</h1>
    <p class="desc">Descrição do produto ou serviço que você está promovendo.</p>

    <!-- Troque a URL abaixo pela imagem real do produto -->
    <img src="https://via.placeholder.com/480x270/21262d/ffffff?text=Foto+do+Produto" alt="Produto" class="product-img">

    <div class="price-box">
      <div class="old-price">De R$ 197,00</div>
      <div class="current-price">Por R$ 97,00</div>
    </div>

    <!-- COLOQUE O SEU LINK DE AFILIADO/CHECKOUT NO HREF ABAIXO -->
    <a href="https://SEU_LINK_DE_AFILIADO_AQUI" class="btn-buy" target="_blank">
      COMPRAR AGORA
    </a>
  </div>

</body>
</html>
