<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klico IA - Conexões & Configurações</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0d1117; color: #f0f6fc; font-family: sans-serif; }
    .card { background-color: #161b22; border: 1px solid #30363d; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-center">
  <div class="w-full max-w-lg card rounded-2xl p-6 shadow-2xl">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-6">
      <div class="bg-orange-500 text-white font-bold w-10 h-10 rounded-lg flex items-center justify-center text-xl">
        K
      </div>
      <div>
        <h1 class="text-xl font-bold text-white">Klico IA</h1>
        <p class="text-xs text-gray-400">Configure as suas integrações e tags de afiliado</p>
      </div>
    </div>

    <!-- Formulário de Configurações -->
    <form id="configForm" onsubmit="salvarConfiguracoes(event)" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">
          Tag / ID de Afiliado Shopee
        </label>
        <input 
          type="text" 
          id="shopeeTag" 
          placeholder="exemplo_afiliado_123" 
          class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition"
          required
        >
        <p class="text-xs text-gray-400 mt-1">O seu identificador ou tag sub_id da Shopee para comissões.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">
          Chave da API Google Gemini (Opcional)
        </label>
        <input 
          type="password" 
          id="geminiKey" 
          placeholder="AIzaSy..." 
          class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition"
        >
        <p class="text-xs text-gray-400 mt-1">Permite utilizar inteligência artificial personalizada para gerar legendas e textos automáticos.</p>
      </div>

      <button 
        type="submit" 
        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition duration-200 flex justify-center items-center gap-2 shadow-lg"
      >
        <i class="fas fa-save"></i> Salvar Configurações
      </button>
    </form>

    <div id="mensagemSucesso" class="hidden mt-4 p-3 bg-green-900/50 border border-green-500 text-green-200 text-sm rounded-lg text-center">
      <i class="fas fa-check-circle mr-1"></i> Configurações salvas com sucesso no seu dispositivo!
    </div>
  </div>

  <script>
    // Carregar configurações guardadas previamente
    document.addEventListener('DOMContentLoaded', () => {
      const savedTag = localStorage.getItem('klico_shopee_tag') || '';
      const savedKey = localStorage.getItem('klico_gemini_key') || '';
      if(savedTag) document.getElementById('shopeeTag').value = savedTag;
      if(savedKey) document.getElementById('geminiKey').value = savedKey;
    });

    function salvarConfiguracoes(event) {
      event.preventDefault();
      const tag = document.getElementById('shopeeTag').value.trim();
      const key = document.getElementById('geminiKey').value.trim();

      localStorage.setItem('klico_shopee_tag', tag);
      localStorage.setItem('klico_gemini_key', key);

      const msg = document.getElementById('mensagemSucesso');
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
