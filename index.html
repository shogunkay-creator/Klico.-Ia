<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta Especial | Entrega Automática</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .top-bar {
      width: 100%;
      background: #1e293b;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
      border-bottom: 1px solid #334155;
    }
    .card {
      max-width: 500px;
      width: 90%;
      margin: 24px auto;
      background: #111827;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #1f2937;
    }
    .badge {
      background: #dc2626;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      color: #f9fafb;
    }
    p.desc {
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .product-img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
      display: block;
      object-fit: cover;
    }
    .price-container {
      background: #0d1321;
      padding: 16px;
      border-radius: 12px;
      border: 1px dashed #3b82f6;
      text-align: center;
      margin-bottom: 20px;
    }
    .old-price {
      text-decoration: line-through;
      color: #6b7280;
      font-size: 14px;
    }
    .current-price {
      font-size: 30px;
      font-weight: 800;
      color: #22c55e;
      margin-top: 4px;
    }
    .btn-buy {
      display: block;
      width: 100%;
      background: #22c55e;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-buy:hover {
      background: #16a34a;
      transform: translateY(-1px);
    }
